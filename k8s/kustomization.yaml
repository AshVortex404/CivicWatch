apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: civicwatch

resources:
  - namespace.yaml
  - configmap.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml

# Kustomize image transformers allow overriding <IMAGE_TAG> with immutable Git SHAs cleanly:
# e.g., kustomize edit set image ghcr.io/ashvortex404/citycare24-backend=ghcr.io/ashvortex404/citycare24-backend:<git-sha>
images:
  - name: ghcr.io/ashvortex404/citycare24-backend
    newName: ghcr.io/ashvortex404/citycare24-backend
    newTag: latest
  - name: ghcr.io/ashvortex404/citycare24-frontend
    newName: ghcr.io/ashvortex404/citycare24-frontend
    newTag: latest
