---
- name: Configure CityCare24 Server
  hosts: webserver
  become: true
  gather_facts: true

  tasks:

    # 1. Update Ubuntu package cache
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    # 2. Install required packages
    - name: Install required packages
      apt:
        name:
          - git
          - ca-certificates
          - curl
        state: present

    # 3. Install Docker
    - name: Install Docker
      apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present

    # 4. Start Docker
    - name: Start Docker service
      service:
        name: docker
        state: started
        enabled: true

    # 5. Add ubuntu user to Docker group
    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: true

    # 6. Clone application
    - name: Clone CityCare24 repository
      git:
        repo: "https://github.com/sarthak018-hub/CityCare24.git"
        dest: /home/ubuntu/CityCare24
        version: main
        force: yes
      become_user: ubuntu

    # 7. Copy Docker files (not committed to git)
    - name: Copy docker-compose.yml
      copy:
        src: /home/sensei/CityCare24/docker-compose.yml
        dest: /home/ubuntu/CityCare24/docker-compose.yml
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Copy backend Dockerfile
      copy:
        src: /home/sensei/CityCare24/backend/Dockerfile
        dest: /home/ubuntu/CityCare24/backend/Dockerfile
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Copy frontend Dockerfile
      copy:
        src: /home/sensei/CityCare24/frontend/Dockerfile
        dest: /home/ubuntu/CityCare24/frontend/Dockerfile
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    # 8. Create backend environment file
    - name: Create backend environment file
      copy:
        dest: /home/ubuntu/CityCare24/backend/.env
        owner: ubuntu
        group: ubuntu
        mode: "0600"
        content: |
          MONGO_URI={{ mongo_uri }}

    # 8. Create swap for small EC2 instance
    - name: Check if swap exists
      command: swapon --show
      register: swap_status
      changed_when: false

    - name: Create 2GB swap file
      command: fallocate -l 2G /swapfile
      when: swap_status.stdout == ""

    - name: Set swap file permissions
      file:
        path: /swapfile
        owner: root
        group: root
        mode: "0600"
      when: swap_status.stdout == ""

    - name: Format swap file
      command: mkswap /swapfile
      when: swap_status.stdout == ""

    - name: Enable swap
      command: swapon /swapfile
      when: swap_status.stdout == ""

    - name: Make swap permanent
      mount:
        path: none
        src: /swapfile
        fstype: swap
        opts: sw
        state: present

    # 9. Build and start application
    - name: Build and start CityCare24
      become_user: ubuntu
      shell: cd /home/ubuntu/CityCare24 && docker compose up -d --build
      args:
        executable: /bin/bash

    # 10. Show container status
    - name: Show running containers
      become_user: ubuntu
      shell: cd /home/ubuntu/CityCare24 && docker compose ps
      args:
        executable: /bin/bash
      register: compose_status

    # 11. Display status
    - name: Display container status
      debug:
        var: compose_status.stdout