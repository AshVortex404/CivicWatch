services:

  backend:
    build:
      context: ./backend
    container_name: citycare-backend
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: citycare-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
